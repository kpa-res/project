<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АвтоКаталог ВАЗ — каталог для автосервиса</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#151a22; --muted:#6b7686; --line:#e3e8ef;
  --accent:#e53935; --accent-d:#c62828; --dark:#161b24; --dark-2:#1f2632;
  --r:14px; --shadow:0 2px 10px rgba(20,26,34,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 18px}

.topbar{position:sticky;top:0;z-index:50;background:var(--dark);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.topbar .wrap{display:flex;align-items:center;gap:22px;height:62px}
.logo{font-weight:800;letter-spacing:.5px;font-size:17px;white-space:nowrap}
.logo span{color:var(--accent)}
.search-wrap{position:relative;flex:1;max-width:520px}
#search{width:100%;height:40px;border-radius:10px;border:1px solid #2b3341;background:var(--dark-2);color:#fff;padding:0 14px 0 38px;outline:none;font-size:14px}
#search::placeholder{color:#7d8798}
#search:focus{border-color:var(--accent)}
.search-ico{position:absolute;left:12px;top:11px;opacity:.55;pointer-events:none}
.search-results{position:absolute;top:46px;left:0;right:0;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 12px 34px rgba(15,20,30,.22);overflow:hidden;max-height:70vh;overflow-y:auto}
.search-results.hidden{display:none}
.sr-item{display:block;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:#f4f6f9}
.sr-item b{font-weight:600}
.sr-item small{display:block;color:var(--muted);font-size:12px}
.sr-empty{padding:14px;color:var(--muted);font-size:14px}

.crumbs{background:#fff;border-bottom:1px solid var(--line);font-size:13px}
.crumbs .wrap{display:flex;gap:8px;align-items:center;height:42px;overflow-x:auto;white-space:nowrap}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--accent)}
.crumbs span.sep{color:#c3cad6}
.crumbs .cur{color:var(--ink);font-weight:600}

main{padding:26px 0 70px;min-height:60vh}
h1{font-size:26px;margin:0 0 8px;letter-spacing:-.4px}
h2.section-title{font-size:19px;margin:34px 0 14px}
.hero{background:linear-gradient(135deg,#1f2632,#2c3546);color:#fff;border-radius:18px;padding:30px 28px;margin-bottom:10px}
.hero h1{color:#fff}
.hero p{color:#b9c2d1;margin:0 0 22px;max-width:640px}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:22px;color:#fff;line-height:1.1}
.stats span{font-size:12px;color:#93a0b4;text-transform:uppercase;letter-spacing:.6px}

.grid{display:grid;gap:16px}
.grid.families{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:16px}

.fam{display:flex;flex-direction:column;gap:10px;transition:.16s;cursor:pointer}
.fam:hover{transform:translateY(-2px);border-color:#cfd7e3;box-shadow:0 8px 22px rgba(20,26,34,.09)}
.fam-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fam-name{font-size:17px;font-weight:700}
.fam-years{font-size:12px;color:var(--muted);white-space:nowrap}
.fam-desc{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:20px;background:#eef1f6;color:#495261;border:1px solid #e3e8ef}

.mod-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 18px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;transition:.15s}
.mod-row:hover{border-color:#cfd7e3;box-shadow:var(--shadow)}
.mod-row .name{font-weight:600}
.mod-row .sub{font-size:13px;color:var(--muted)}
.arrow{color:#b9c2d1;font-size:20px}

.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;transition:.15s}
.btn:hover{background:var(--accent-d)}
.btn.ghost{background:#eef1f6;color:#3d4655}
.btn.ghost:hover{background:#e2e7ef}

.mod-head{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:20px}
.mod-head .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent-d);background:#fdeaea;border:1px solid #f7cfcf;border-radius:20px;padding:3px 10px;margin-bottom:10px}
.quick{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.quick div{display:flex;flex-direction:column}
.quick span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.quick b{font-size:15px}

.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{padding:11px 16px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

table{width:100%;border-collapse:collapse}
.kv th{text-align:left;font-weight:500;color:var(--muted);padding:9px 0;width:45%;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.kv td{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:500}
.kv tr:last-child th,.kv tr:last-child td{border-bottom:none}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}

.fluid{padding:11px 0;border-bottom:1px solid var(--line)}
.fluid:last-child{border-bottom:none}
.fluid-k{font-size:13px;color:var(--muted)}
.fluid-v{font-weight:600;font-size:15px}
.fluid-n{font-size:12.5px;color:var(--muted)}

.docs-card{margin-top:16px}
.doc-row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;transition:.15s}
.doc-row:last-child{border-bottom:none}
.doc-row:hover{background:#fafbfd;padding-left:6px;padding-right:6px;border-radius:8px}
.doc-ico{width:32px;height:32px;flex-shrink:0;border-radius:8px;background:#eef4ff;color:#1a52a8;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.doc-body{flex:1}
.doc-type{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:2px}
.doc-title{font-size:14px;font-weight:600;color:var(--ink)}
.doc-row:hover .doc-title{color:var(--accent-d)}
.doc-arrow{color:#b9c2d1;font-size:18px;align-self:center}

.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters button{padding:6px 13px;border-radius:20px;background:#eef1f6;font-size:13px;color:#495261;border:1px solid #e3e8ef}
.filters button.active{background:var(--dark);color:#fff;border-color:var(--dark)}

table.data{font-size:14px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
table.data thead th{background:#f0f3f8;text-align:left;padding:11px 14px;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:#5c6678;font-weight:600;white-space:nowrap}
table.data td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
table.data tr:hover td{background:#fafbfd}
.tag-type{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-replace{background:#e8f5e9;color:#2e7d32}
.t-check{background:#e3f2fd;color:#1565c0}
.t-adjust{background:#fff4e5;color:#b26a00}
tr.critical td{background:#fff7f7}
tr.critical:hover td{background:#ffefef}
.crit-badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}

details.proc{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
details.proc summary{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;list-style:none;font-weight:600;font-size:15px}
details.proc summary::-webkit-details-marker{display:none}
details.proc summary:hover{background:#fafbfd}
details.proc[open] summary{border-bottom:1px solid var(--line);background:#fafbfd}
.proc-meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:500;color:#495261;background:#eef1f6;border-radius:20px;padding:3px 10px;white-space:nowrap}
.pill.hard{background:#fdeaea;color:var(--accent-d)}
.pill.mid{background:#fff4e5;color:#b26a00}
.pill.easy{background:#e8f5e9;color:#2e7d32}
.proc-body{padding:18px}
.proc-body h4{margin:18px 0 9px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.proc-body h4:first-child{margin-top:0}
.tool-chips{display:flex;flex-wrap:wrap;gap:7px}
.tool-chip{font-size:13px;background:#f0f3f8;border:1px solid var(--line);border-radius:8px;padding:5px 11px}

ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{position:relative;padding:0 0 16px 42px;counter-increment:s;border-left:2px solid #eef1f6;margin-left:13px}
ol.steps li:last-child{border-left-color:transparent;padding-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:-14px;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--dark);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step-text{font-size:14.5px;padding-top:2px}
.step-extra{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.torque{font-size:12.5px;font-weight:600;background:#fff4e5;color:#b26a00;border:1px solid #ffe0b2;border-radius:7px;padding:3px 9px}
.part-link{font-size:12.5px;background:#eef4ff;color:#1a52a8;border:1px solid #d3e0f7;border-radius:7px;padding:3px 9px}
.part-link:hover{background:#dde8fb}
.warn{background:#fff7f7;border:1px solid #f7cfcf;border-left:4px solid var(--accent);border-radius:10px;padding:13px 16px;margin-top:16px;font-size:14px}
.warn b{color:var(--accent-d)}
.warn ul{margin:8px 0 0;padding-left:20px}
.warn li{margin-bottom:5px}

.diag-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.diag-tab{padding:8px 15px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:#495261}
.diag-tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.diagram-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
svg.diagram{width:100%;height:auto;display:block;border-radius:10px;background:#fbfcfe}
.part-shape{fill:#dfe4ee;stroke:#9aa6bd;stroke-width:2;cursor:pointer;transition:.15s}
.part-shape:hover{fill:#cfd8e8}
.part-shape.is-sel{filter:drop-shadow(0 0 7px rgba(229,57,53,.9));stroke:#e53935}
.badge{cursor:pointer}
.badge circle{fill:#e53935;stroke:#fff;stroke-width:2}
.badge text{fill:#fff;font:700 14px sans-serif;text-anchor:middle;pointer-events:none}
.badge.is-sel circle{fill:#161b24;stroke:#e53935;stroke-width:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:10px 6px 0}

table.parts{margin-top:16px}
table.parts td{padding:9px 14px}
table.parts tbody tr{cursor:pointer}
table.parts tbody tr.is-sel td{background:#fdeaea}
.badge-cell{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;align-items:center;justify-content:center}
tr.is-sel .badge-cell{background:var(--dark)}
.oem{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#1a52a8;border-bottom:1px dashed #9db8e8}
.oem:hover{color:var(--accent)}

.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(12,16,22,.55);backdrop-filter:blur(2px)}
.modal-card{position:relative;background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal-x{position:absolute;top:12px;right:14px;font-size:26px;line-height:1;color:var(--muted)}
.modal-x:hover{color:var(--ink)}
.poem{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;font-weight:600;background:#f0f3f8;border-radius:8px;padding:8px 12px;display:inline-block;margin:6px 0 14px}
.cross-list{display:flex;flex-direction:column;gap:7px}
.cross-item{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px}
.cross-item span:last-child{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:18px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:12px}

footer{border-top:1px solid var(--line);background:#fff;padding:22px 0;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);opacity:0;background:var(--dark);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;z-index:200;transition:.28s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:640px){
  .topbar .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap;gap:10px}
  .search-wrap{max-width:none;flex-basis:100%}
  h1{font-size:21px}
  .hero{padding:22px 20px}
  .quick{gap:18px}
}
</style>
</head>

function makeMod(cfg) {
  const eng = cfg.engine;
  const specs = cfg.specs || [
    { k:'Двигатель',        v:`${eng.code} — ${eng.desc}` },
    { k:'Мощность',         v:`${eng.power} л.с.` },
    { k:'Крутящий момент',  v:`${eng.torque} Н·м` },
    { k:'Коробка передач',  v:cfg.transmission },
    { k:'Привод',           v:cfg.drive },
    { k:'Тип кузова',       v:cfg.body },
    { k:'Годы выпуска',     v:cfg.years }
  ];
  const fluids = cfg.fluids || [
    { k:'Моторное масло',       v:(eng.power > 90 ? '3,5 л' : '3,2 л'), n:'API SJ/SL и выше · 5W-30 / 5W-40' },
    { k:'Трансмиссионное масло', v:'2,8–3,0 л',                          n:'GL-4 · 75W-90 / 80W-85' },
    { k:'Тормозная жидкость',    v:'DOT-4',                              n:'Замена каждые 2 года' },
    { k:'Охлаждающая жидкость',  v:'G12+ (карбоксилатный)',              n:'Объём уточняется по комплектации' }
  ];
  return Object.assign({}, cfg, {
    specs,
    fluids,
    maintenance: cfg.maintenance || stdMaintenance(),
    procedures:  cfg.procedures  || baseProcedures(),
    diagrams:    cfg.diagrams    || [],
    docs:        cfg.docs        || []
  });
}

/* =========================================================
   6. ИНДЕКСЫ
   ========================================================= */
const IDX = { family:{}, model:{}, mod:{} };
DB.families.forEach(f => {
  IDX.family[f.id] = f;
  f.models.forEach(m => {
    IDX.model[m.id] = { model:m, family:f };
    m.mods.forEach(md => { IDX.mod[md.id] = { mod:md, model:m, family:f }; });
  });
});
const allMods = () => DB.families.flatMap(f => f.models.flatMap(m => m.mods));
const countModels = () => DB.families.reduce((a,f) => a + f.models.length, 0);
const countProcs = () => allMods().reduce((a,m) => a + m.procedures.length, 0);
const countDiagramPos = () => allMods().reduce((a,m) => a + m.diagrams.reduce((b,d) => b + d.positions.length, 0), 0);
const countDocs = () => allMods().reduce((a,m) => a + m.docs.length, 0);

/* =========================================================
   7. РОУТЕР
   ========================================================= */
const app = $('#app');
const crumbsEl = $('#crumbs .wrap');

function parseHash() {
  const raw = location.hash.replace(/^#/, '') || '/';
  return raw.split('/').filter(Boolean);
}

function crumbs(items) {
  const parts = [`<a href="#/">Каталог</a>`];
  items.forEach((it, i) => {
    parts.push('<span class="sep">/</span>');
    parts.push(i === items.length - 1
      ? `<span class="cur">${esc(it.label)}</span>`
      : `<a href="${it.href}">${esc(it.label)}</a>`);
  });
  crumbsEl.innerHTML = parts.join('');
}

function route() {
  const p = parseHash();
  window.scrollTo({ top:0, behavior:'instant' });
  if (p.length === 0)                       return renderHome();
  if (p[0] === 'f' && IDX.family[p[1]])     return renderFamily(p[1]);
  if (p[0] === 'm' && IDX.model[p[1]])      return renderModel(p[1]);
  if (p[0] === 'x' && IDX.mod[p[1]])        return renderMod(p[1], p[2] || 'specs');
  renderHome();
}

      <thead>
        <tr><th>Операция</th><th>Пробег</th><th>Срок</th><th>Тип</th></tr>
      </thead>
      <tbody>
        ${m.maintenance.map(row => `
          <tr data-type="${row.type}" class="${row.critical ? 'critical' : ''}">
            <td>
              ${esc(row.op)}${row.critical ? '<span class="crit-badge">важно</span>' : ''}
              ${row.note ? `<div style="font-size:12.5px;color:var(--muted);margin-top:4px">${esc(row.note)}</div>` : ''}
            </td>
            <td style="white-space:nowrap">${row.km ? row.km.toLocaleString('ru-RU') + ' км' : '—'}</td>
            <td style="white-space:nowrap">${row.mo ? row.mo + ' мес.' : '—'}</td>
            <td><span class="tag-type t-${row.type}">${TYPE_LABEL[row.type] || row.type}</span></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function bindMaintenance() {
  $$('.filters button').forEach(b => {
    b.addEventListener('click', () => {
      maintFilter = b.dataset.filter;
      $$('.filters button').forEach(x => x.classList.toggle('active', x === b));
      $$('#maint-table tbody tr').forEach(tr => {
        tr.style.display = (maintFilter === 'all' || tr.dataset.type === maintFilter) ? '' : 'none';
      });
    });
  });
  if (maintFilter !== 'all') {
    $$('#maint-table tbody tr').forEach(tr => {
      tr.style.display = tr.dataset.type === maintFilter ? '' : 'none';
    });
  }
}

function levelClass(l) {
  if (/сложн/i.test(l)) return 'hard';
  if (/средн/i.test(l)) return 'mid';
  return 'easy';
}

function viewProcedures(m) {
  if (!m.procedures.length) return `<div class="empty">Техкарты для этой модификации пока не добавлены.</div>`;
  return m.procedures.map((p, i) => `
    <details class="proc" ${i === 0 ? 'open' : ''}>
      <summary>
        <span>${esc(p.title)}</span>
        <span class="proc-meta">
          <span class="pill">⏱ ${esc(p.time)}</span>
          <span class="pill ${levelClass(p.level)}">${esc(p.level)}</span>
        </span>
      </summary>
      <div class="proc-body">
        <h4>Инструмент и приспособления</h4>
        <div class="tool-chips">
          ${p.tools.map(t => `<span class="tool-chip">${esc(t)}</span>`).join('')}
        </div>
        <h4>Порядок работ</h4>
        <ol class="steps">
          ${p.steps.map(s => `
            <li>
              <div class="step-text">${esc(s.text)}</div>
              ${(s.torque || (s.parts && s.parts.length)) ? `
                <div class="step-extra">
                  ${s.torque ? `<span class="torque">🔧 ${esc(s.torque)}</span>` : ''}
                  ${(s.parts || []).map(pt => `
                    <button class="part-link" data-oem="${esc(pt.oem)}" data-name="${esc(pt.name)}">
                      ${esc(pt.name)} · ${esc(pt.oem)}
                    </button>`).join('')}
                </div>` : ''}
            </li>`).join('')}
        </ol>
        ${p.warnings && p.warnings.length ? `
          <div class="warn">
            <b>Подводные камни</b>
            <ul>${p.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>
          </div>` : ''}
      </div>
    </details>`).join('');
}

let activeDiag = 0;
let selectedPos = null;

function viewSchemes(m) {
  if (!m.diagrams.length) return `<div class="empty">Взрыв-схемы для этой модификации пока не добавлены.</div>`;

  const d = m.diagrams[activeDiag];
  return `
    ${m.diagrams.length > 1 ? `
      <div class="diag-tabs">
        ${m.diagrams.map((dd, i) => `<button class="diag-tab ${i === activeDiag ? 'active' : ''}" data-diag="${i}">${esc(dd.title)}</button>`).join('')}
      </div>` : ''}

    <div class="diagram-box">
      ${diagramSVG(d)}
      <div class="legend">
        <span>Нажмите на номер на схеме или на строку таблицы — позиция подсветится.</span>
      </div>
    </div>

    <table class="data parts" id="parts-table">
      <thead>
        <tr><th style="width:52px">№</th><th>Наименование</th><th>Каталожный номер</th><th style="width:70px">Кол-во</th><th style="width:120px"></th></tr>
      </thead>
      <tbody>
        ${d.positions.slice().sort((a,b) => a.pos - b.pos).map(p => `
          <tr data-pos="${p.pos}">
            <td><span class="badge-cell">${p.pos}</span></td>
            <td>${esc(p.name)}${p.note ? `<div style="font-size:12px;color:var(--muted)">${esc(p.note)}</div>` : ''}</td>
            <td><span class="oem">${esc(p.oem)}</span></td>
            <td>${p.qty}</td>
            <td><button class="btn ghost" style="height:30px;padding:0 12px;font-size:12.5px" data-oem="${esc(p.oem)}" data-name="${esc(p.name)}">Подробнее</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function diagramSVG(d) {
  const sorted = [...d.positions].sort((a,b) => (a.z || 1) - (b.z || 1));
  let body = `
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0 L0 0 0 40" fill="none" stroke="#e8ebf0" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"/>`;
  sorted.forEach(p => {
    const cls = `part-shape pos-${p.pos}`;
    if (p.type === 'belt') {
      body += `<polygon class="${cls}" points="${p.points}" fill="none" stroke="#3a4150" stroke-width="${p.width || 16}" stroke-linejoin="round" stroke-linecap="round"/>`;
    } else if (p.type === 'circle') {
      body += `<circle class="${cls}" cx="${p.cx}" cy="${p.cy}" r="${p.r}"/>`;
      if (p.hole) {
        body += `<circle cx="${p.cx}" cy="${p.cy}" r="${Math.round(p.r * 0.38)}" fill="#fbfcfe" stroke="#c8cedb" stroke-width="2" pointer-events="none"/>`;
      }
    } else if (p.type === 'rect') {
      body += `<rect class="${cls}" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${p.rx || 10}"/>`;
    }
  });
  d.positions.forEach(p => {
    const [bx, by] = p.badge;
    body += `
      <g class="badge pos-${p.pos}" data-pos="${p.pos}" transform="translate(${bx},${by})">
        <circle r="15"/>
        <text y="5">${p.pos}</text>
      </g>`;
  });
  return `<svg class="diagram" viewBox="${d.viewBox}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}

function selectPos(n) {
  selectedPos = n;
  $$('.part-shape').forEach(s => s.classList.remove('is-sel'));
  $$('.badge').forEach(s => s.classList.remove('is-sel'));
  $$('#parts-table tbody tr').forEach(s => s.classList.remove('is-sel'));
  if (n == null) return;
  $$('.pos-' + n).forEach(e => e.classList.add('is-sel'));
  const row = $(`#parts-table tbody tr[data-pos="${n}"]`);
  if (row) row.classList.add('is-sel');
}

function bindSchemes(m) {
  selectedPos = null;
  $$('.diag-tab').forEach(b => {
    b.addEventListener('click', () => {
      activeDiag = +b.dataset.diag;
      renderMod(m.id, 'schemes');
    });
  });
  $$('.badge, .part-shape').forEach(el => {
    el.addEventListener('click', () => {
      const n = +el.dataset.pos || +el.classList.toString().match(/pos-(\d+)/)[1];
      selectPos(selectedPos === n ? null : n);
    });
  });
  $$('#parts-table tbody tr').forEach(tr => {
    tr.addEventListener('click', e => {
      if (e.target.closest('button')) return;
      const n = +tr.dataset.pos;
      selectPos(selectedPos === n ? null : n);
    });
  });
}

/* =========================================================
   11. МОДАЛЬНОЕ ОКНО ДЕТАЛИ
   ========================================================= */
const modal = $('#modal');
const modalBody = $('#modal-body');

function openPart(oem, name) {
  const p = partInfo(oem, name);
  modalBody.innerHTML = `
    <div style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px">Карточка детали</div>
    <h2 style="margin:0 0 6px;font-size:19px">${esc(p.name)}</h2>
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Производитель: ${esc(p.brand)}</div>
    <div class="poem">${esc(oem)}</div>
    <h4 style="margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">Кросс-номера аналогов</h4>
    ${p.crosses.length
      ? `<div class="cross-list">${p.crosses.map(c => `<div class="cross-item"><span>${esc(c)}</span><span>аналог</span></div>`).join('')}</div>`
      : `<div style="color:var(--muted);font-size:13.5px;margin-bottom:10px">Аналоги не указаны — рекомендуется оригинал.</div>`}
    <div style="display:flex;gap:16px;margin:18px 0 4px;font-size:14px">
      <div><div style="font-size:12px;color:var(--muted)">Цена</div><b>${esc(p.price)}</b></div>
      <div><div style="font-size:12px;color:var(--muted)">Наличие</div><b>${esc(p.stock)}</b></div>
    </div>
    <button class="btn" style="width:100%;justify-content:center;margin-top:18px" data-add="${esc(oem)}">Добавить в заказ</button>`;
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.hidden = true;
  document.body.style.overflow = '';
}

/* =========================================================
   12. ПОИСК
   ========================================================= */
const searchInput = $('#search');
const searchBox = $('#search-results');

function searchAll(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const out = [];
  DB.families.forEach(f => {
    if (f.name.toLowerCase().includes(q)) out.push({ type:'Семейство', title:f.name, sub:f.years, href:`#/f/${f.id}` });
    f.models.forEach(m => {
      if (m.name.toLowerCase().includes(q)) out.push({ type:'Модель', title:m.name, sub:`${f.name} · ${m.years}`, href:`#/m/${m.id}` });
      m.mods.forEach(md => {
        const hay = `${md.name} ${md.engine.code} ${md.body} ${m.name}`.toLowerCase();
        if (hay.includes(q)) out.push({ type:'Модификация', title:md.name, sub:`${m.name} · ${md.engine.code}`, href:`#/x/${md.id}/specs` });
      });
    });
  });
  Object.keys(PARTS).forEach(oem => {
    const p = PARTS[oem];
    if (oem.toLowerCase().includes(q) || p.name.toLowerCase().includes(q) ||
        p.crosses.some(c => c.toLowerCase().includes(q))) {
      out.push({ type:'Деталь', title:p.name, sub:oem, href:null, oem, name:p.name });
    }
  });
  return out.slice(0, 14);
}

searchInput.addEventListener('input', () => {
  const items = searchAll(searchInput.value);
  if (!searchInput.value.trim()) { searchBox.classList.add('hidden'); return; }
  if (!items.length) {
    searchBox.innerHTML = `<div class="sr-empty">Ничего не найдено</div>`;
    searchBox.classList.remove('hidden');
    return;
  }
  searchBox.innerHTML = items.map((it, i) => `
    <a class="sr-item" data-i="${i}" ${it.href ? `href="${it.href}"` : 'href="javascript:void(0)"'}>
      <b>${esc(it.title)}</b>
      <small>${esc(it.type)} · ${esc(it.sub)}</small>
    </a>`).join('');
  searchBox.classList.remove('hidden');
  $$('.sr-item', searchBox).forEach(el => {
    el.addEventListener('click', () => {
      const it = items[+el.dataset.i];
      if (it.oem) openPart(it.oem, it.name);
      searchBox.classList.add('hidden');
      searchInput.value = '';
    });
  });
});

searchInput.addEventListener('focus', () => {
  if (searchInput.value.trim()) searchBox.classList.remove('hidden');
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) searchBox.classList.add('hidden');
});

/* =========================================================
   13. ГЛОБАЛЬНЫЕ ОБРАБОТЧИКИ
   ========================================================= */
document.addEventListener('click', e => {
  const partBtn = e.target.closest('[data-oem]');
  if (partBtn && !partBtn.dataset.add) {
    openPart(partBtn.dataset.oem, partBtn.dataset.name);
    return;
  }
  if (e.target.closest('[data-close]')) closeModal();
  const addBtn = e.target.closest('[data-add]');
  if (addBtn) {
    toast(`Деталь ${addBtn.dataset.add} добавлена в заказ`);
    closeModal();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =========================================================
   14. СТАРТ
   ========================================================= */
window.addEventListener('hashchange', route);
route();
</script>
